<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Races équines | DicoCheval</title><style>:root{--green:#1f4b3d;--gold:#b58a4b;--cream:#fffaf0;--ink:#193229}*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:var(--ink);font-family:Arial,sans-serif}.top{background:var(--green);color:white;padding:15px 6%;display:flex;justify-content:space-between;align-items:center}.top b{font-family:Georgia,serif;font-size:26px}.top a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:20px;padding:9px 14px}.hero,main{max-width:1180px;margin:auto;padding:55px 24px}.hero{padding-bottom:25px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font:clamp(40px,6vw,70px)/.98 Georgia,serif;margin:12px 0}.hero p{max-width:700px;font-size:18px;line-height:1.6;color:#52675d}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.controls input{min-width:230px;flex:1;border:1px solid #c9d3c8;border-radius:12px;padding:13px;font-size:16px}.controls button{border:0;border-radius:20px;padding:11px 16px;font-weight:bold;background:#dce7df;color:var(--green);cursor:pointer}.controls button.on{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}.breed{cursor:pointer;border:1px solid #d9dfd3;background:white;border-radius:14px;padding:18px;text-align:left;font:700 17px Georgia,serif;color:var(--green);min-height:92px}.breed:hover{border-color:var(--gold);transform:translateY(-2px)}.breed small{display:block;font:12px Arial,sans-serif;color:#8b6a38;margin-top:8px;text-transform:uppercase;letter-spacing:.08em}.modal{position:fixed;inset:0;background:#102b225e;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.sheet{position:relative;width:min(820px,100%);max-height:90vh;overflow:auto;background:var(--cream);padding:36px;border-radius:22px;box-shadow:0 20px 70px #0005}.close{position:absolute;right:18px;top:15px;border:0;background:none;font-size:28px;cursor:pointer}.sheet h2{font:42px Georgia,serif;margin:8px 0 12px}.sheet p{line-height:1.65}.profile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}.profile div{background:white;border:1px solid #e3e2d8;border-radius:12px;padding:13px;line-height:1.45}.google{display:inline-block;background:var(--gold);color:#fff;text-decoration:none;border-radius:20px;padding:12px 16px;font-weight:bold}@media(max-width:550px){.profile{grid-template-columns:1fr}.sheet{padding:28px 20px}.top b{font-size:22px}}</style></head><body><header class="top"><b>DicoCheval</b><a href="index.html">← Retour à l’accueil</a></header><section class="hero"><div class="eyebrow">Guide des races</div><h1>Races équines</h1><p>Découvre les chevaux et les poneys, puis ouvre une fiche complète avec leurs caractéristiques. Les tailles et poids restent indicatifs : chaque animal est unique.</p></section><main><div class="controls"><input id="breedFind" placeholder="Rechercher une race…"><button class="on" data-kind="all">Toutes</button><button data-kind="Cheval">Chevaux</button><button data-kind="Poney">Poneys</button></div><div class="grid" id="breedGrid"></div></main><div class="modal" id="modal" aria-hidden="true"><article class="sheet"><button class="close" id="close" aria-label="Fermer">×</button><div class="eyebrow" id="mtype">FICHE RACE</div><h2 id="mtitle"></h2><p id="mdesc"></p><div class="profile" id="profile"></div><a id="google" class="google" target="_blank" rel="noopener">Rechercher des images</a></article></div><script>const breeds=[['Akhal-Téké','Cheval'],['Andalou','Cheval'],['Appaloosa','Cheval'],['Arabe','Cheval'],['Ardennais','Cheval'],['Australien','Cheval'],['Barbe','Cheval'],['Boulonnais','Cheval'],['Brabançon','Cheval'],['Camargue','Cheval'],['Clydesdale','Cheval'],['Cob normand','Cheval'],['Comtois','Cheval'],['Criollo','Cheval'],['Curly','Cheval'],['Franche-Montagne','Cheval'],['Frison','Cheval'],['Hanovrien','Cheval'],['Holsteiner','Cheval'],['Irish Cob','Cheval'],['Kinsky','Cheval'],['KWPN','Cheval'],['Lusitanien','Cheval'],['Mustang','Cheval'],['Paint Horse','Cheval'],['Percheron','Cheval'],['Pur-sang anglais','Cheval'],['Quarter Horse','Cheval'],['Selle français','Cheval'],['Shagya','Cheval'],['Tennessee Walker','Cheval'],['Trakehner','Cheval'],['Trait breton','Cheval'],['Zangersheide','Cheval'],['Connemara','Poney'],['Dartmoor','Poney'],['Exmoor','Poney'],['Fell','Poney'],['Fjord','Poney'],['Gotland','Poney'],['Haflinger','Poney'],['Highland','Poney'],['Islandais','Cheval'],['Landais','Poney'],['Mérens','Cheval'],['New Forest','Poney'],['Poney français de selle','Poney'],['Shetland','Poney'],['Welsh A','Poney'],['Welsh B','Poney'],['Welsh C','Poney'],['Welsh D','Poney'],['Pottok','Poney'],['Henson','Cheval'],['Hokkaido','Poney'],['Kerry Bog','Poney'],['Lac La Croix','Poney'],['Mongol','Cheval'],['Sorraia','Cheval'],['Tinker','Cheval']];let breedKind='all';const $=id=>document.getElementById(id);function renderBreeds(){let s=$('breedFind').value.toLocaleLowerCase('fr');$('breedGrid').innerHTML=breeds.filter(b=>(breedKind==='all'||b[1]===breedKind)&&b[0].toLocaleLowerCase('fr').includes(s)).map(b=>'<button class="breed" data-name="'+b[0]+'">'+b[0]+'<small>'+b[1]+'</small></button>').join('');document.querySelectorAll('.breed').forEach(b=>b.onclick=()=>openBreed(b.dataset.name))}function openBreed(n){let b=breeds.find(x=>x[0]===n),pony=b[1]==='Poney';let data=pony?['110–148 cm','220–400 kg','robes variées','rustique, intelligent','club, randonnée, polyvalent']:['150–175 cm','450–650 kg','robes variées','sportif, généreux','loisir, disciplines adaptées'];$('mtype').textContent='FICHE RACE · '+b[1];$('mtitle').textContent=n;$('mdesc').textContent='Le '+n+' est une race équine à découvrir. Les caractéristiques peuvent varier selon chaque individu.';$('profile').innerHTML=[['Taille',data[0]],['Poids',data[1]],['Robes',data[2]],['Qualités',data[3]],['Disciplines',data[4]],['À savoir','Une relation respectueuse et un suivi adapté sont essentiels.']].map(x=>'<div><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('');let p=window.breedProfiles?.[n];if(p){$('mdesc').textContent=p.description;$('profile').innerHTML=[['Taille',p.taille],['Poids',p.poids],['Robes',p.robes],['Qualités',p.qualites],['Disciplines',p.disciplines],['À savoir',p.savoir]].map(x=>'<div><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')};$('google').href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(n+' cheval race');$('modal').classList.add('open')}$('breedFind').oninput=renderBreeds;document.querySelectorAll('[data-kind]').forEach(x=>x.onclick=()=>{breedKind=x.dataset.kind;document.querySelectorAll('[data-kind]').forEach(a=>a.classList.toggle('on',a===x));renderBreeds()});$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};renderBreeds();</script><script src="breed-profiles.js"></script></body></html>
