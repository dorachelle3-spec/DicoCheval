<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carte des races | DicoCheval</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--green:#1f4b3d;--gold:#b58a4b;--cream:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#193229;font-family:Arial,sans-serif}.top{background:var(--green);color:white;padding:15px 6%;display:flex;align-items:center;gap:12px}.top b,h1,h2{font-family:Georgia,serif}.top a{margin-left:auto;color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:20px;padding:9px 14px}.page{max-width:1240px;margin:auto;padding:48px 24px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(42px,7vw,70px);margin:10px 0}p{color:#50685d;line-height:1.6}.map{height:650px;border-radius:20px;overflow:hidden;box-shadow:0 12px 28px #19322925;margin-top:28px}.result{margin-top:18px;background:#fffdf8;border:1px solid #d7e0d5;border-radius:18px;padding:25px}.result h2{margin:5px 0}.races{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}.races a{background:#e4eee7;color:#1f4737;text-decoration:none;padding:9px 12px;border-radius:99px;font-weight:bold}.marker{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#234f3a;color:#fff;border:3px solid #fff;box-shadow:0 2px 7px #17352688;font-size:16px}.credit{font-size:12px;margin:10px 2px}.credit a{color:#1f4b3d}@media(max-width:650px){.map{height:470px}}</style></head><body><header class="top"><b>DicoCheval</b><a href="index.html">← Retour à l’accueil</a></header><main class="page"><div class="eyebrow">Explorer le monde</div><h1>Carte des races</h1><p>Zoome, déplace la carte et clique sur un marqueur pour découvrir les races liées à un pays.</p><div id="map" class="map"></div><p class="credit">Carte : <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.</p><article class="result"><div class="eyebrow">Races liées à ce pays</div><h2 id="country">Choisis un pays sur la carte</h2><p id="intro">Les races associées apparaîtront ici.</p><div class="races" id="races"></div></article></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const countries={France:[[46.2,2.2],['Selle français','Camargue','Percheron','Comtois','Trait breton','Henson','Landais','Pottok']],Espagne:[[40.4,-3.7],['Andalou','Pottok']],Portugal:[[39.6,-8.1],['Lusitanien']],"Royaume-Uni":[[54,-2.5],['Pur-sang anglais','Clydesdale','Dartmoor','Exmoor','Fell','Highland','New Forest','Shetland','Welsh']],Irlande:[[53.2,-8.1],['Irish Cob','Connemara','Kerry Bog']],Islande:[[64.9,-18.6],['Islandais']],Allemagne:[[51.2,10.5],['Hanovrien','Holsteiner','Trakehner']],"Pays-Bas":[[52.2,5.3],['Frison','KWPN']],Belgique:[[50.5,4.5],['Trait belge','Zangersheide']],Autriche:[[47.5,14.5],['Haflinger']],Norvège:[[64.5,11.5],['Fjord']],Suède:[[62,15],['Gotland']],Hongrie:[[47.2,19.5],['Shagya']],"Tchéquie":[[49.8,15.5],['Kinsky']],Maroc:[[31.8,-7.1],['Barbe']],Algérie:[[28,2.6],['Barbe']],"États-Unis":[[39,-98],['Appaloosa','Mustang','Paint Horse','Quarter Horse','Tennessee Walker']],Canada:[[56,-106],['Lac La Croix']],Argentine:[[-38,-63],['Criollo']],Turkménistan:[[39,59],['Akhal-Téké']],Mongolie:[[46,103],['Mongol']],Japon:[[36,138],['Hokkaido']],Australie:[[-25,134],['Australien']]};const map=L.map('map',{worldCopyJump:true,minZoom:2,maxZoom:7}).setView([22,8],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);Object.entries(countries).forEach(([country,[coords,breeds]])=>{const icon=L.divIcon({className:'',html:'<span class="marker">🐴</span>',iconSize:[30,30],iconAnchor:[15,15]});L.marker(coords,{icon,title:country}).addTo(map).bindTooltip(country,{direction:'top'}).on('click',()=>{document.getElementById('country').textContent=country;document.getElementById('intro').textContent=breeds.length+' races à découvrir.';document.getElementById('races').innerHTML=breeds.map(b=>'<a href="races.html">'+b+'</a>').join('')})});</script><script src="page-locale.js?v=20260727-langfix"></script></body></html>
