<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon cheval idéal | DicoCheval</title><style>:root{--g:#1f4b3d;--gold:#b58a4b;--cream:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#f4f0e6;color:#193229;font-family:Arial,sans-serif}.top{padding:15px 6%;background:var(--g);display:flex;justify-content:space-between;color:#fff}.top b,h1,h2{font-family:Georgia,serif}.top a{color:white;text-decoration:none;border:1px solid #ffffff80;border-radius:20px;padding:9px 14px}.page{max-width:1000px;margin:auto;padding:55px 22px}.eyebrow{color:var(--gold);font-weight:bold;letter-spacing:.1em;text-transform:uppercase;font-size:12px}h1{font-size:clamp(42px,7vw,70px);margin:10px 0}p{line-height:1.6;color:#50685d}.card{background:#fffdf8;border:1px solid #d9dfd3;border-radius:20px;padding:28px;margin-top:28px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.form label{display:grid;gap:7px;font-weight:bold}.form select,.form input{border:1px solid #cbd5ca;border-radius:10px;padding:12px;font:inherit;background:white}.wide{grid-column:1/-1}.btn{margin-top:22px;border:0;border-radius:24px;background:var(--g);color:white;padding:13px 18px;font-weight:bold;cursor:pointer}.notice{min-height:24px;color:#a43c2d;font-weight:bold}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:20px}.result{background:#edf2ea;padding:18px;border-radius:14px}.result h3{font-family:Georgia,serif;margin:0 0 8px}@media(max-width:650px){.form,.results{grid-template-columns:1fr}}</style><script src="theme.js?v=20260812"></script></head><body><header class="top"><b>DicoCheval</b><a href="dicocheval.html">← Retour à l’accueil</a></header><main class="page"><div class="eyebrow">Questionnaire indicatif</div><h1>Mon cheval idéal</h1><p>Cette fiche donne des pistes selon ton expérience, tes envies et ton gabarit. Elle ne remplace jamais l’avis d’un moniteur ou d’un professionnel avant une acquisition.</p><section class="card"><div class="form"><label>Ton expérience<select id="exp"><option value="">Choisir…</option><option value="beginner">Je débute</option><option value="regular">Je monte régulièrement</option><option value="sport">Je veux un cheval sportif</option></select></label><label>Ce que tu préfères<select id="pref"><option value="">Choisir…</option><option value="calm">Calme et proche de l’humain</option><option value="outdoor">Randonnée et extérieur</option><option value="jump">Saut et polyvalence</option></select></label><label>Type souhaité<select id="size"><option value="">Choisir…</option><option value="pony">Poney</option><option value="medium">Cheval moyen</option><option value="large">Grand cheval</option></select></label><label>Ton poids<select id="unit"><option value="kg">kilogrammes</option><option value="lb">livres</option></select><input id="weight" type="number" min="20" placeholder="Ex. 55"></label><label>Ta taille<select id="heightUnit"><option value="cm">centimètres</option><option value="ft">pieds (ex. 5.4)</option></select><input id="height" type="number" min="1" step="0.1" placeholder="Ex. 160"></label></div><button class="btn" id="find">Trouver ma race</button><div class="notice" id="notice"></div><div class="results" id="results"></div></section></main><script>const $=id=>document.getElementById(id),pools={pony:{calm:['Shetland','Haflinger','Welsh B'],outdoor:['Connemara','Fjord','Highland'],jump:['Connemara','Poney français de selle','Welsh D']},medium:{calm:['Camargue','Franche-Montagne','Irish Cob'],outdoor:['Barbe','Henson','Mérens'],jump:['Selle français','Hanovrien','KWPN']},large:{calm:['Percheron','Clydesdale','Trait breton'],outdoor:['Arabe','Shagya','Tennessee Walker'],jump:['Holsteiner','Zangersheide','Trakehner']}};let last='';$('find').onclick=()=>{let exp=$('exp').value,pref=$('pref').value,size=$('size').value,w=+$('weight').value,h=+$('height').value;if(!exp||!pref||!size||!w||!h){$('notice').textContent='Tu n’as pas rempli toutes les informations.';return}let kg=$('unit').value==='lb'?w*.453592:w,cm=$('heightUnit').value==='ft'?h*30.48:h;if(kg<20||cm<90||cm>230){$('notice').textContent='Vérifie ton poids et ta taille.';return}$('notice').textContent='';let key=[exp,pref,size,kg.toFixed(1),cm.toFixed(1)].join('|');if(key===last)return;last=key;let list=[...pools[size][pref]];if(exp==='beginner')list.sort((a,b)=>['Shetland','Haflinger','Fjord','Camargue','Franche-Montagne','Irish Cob'].includes(b)-['Shetland','Haflinger','Fjord','Camargue','Franche-Montagne','Irish Cob'].includes(a));if(kg>85||cm>180)list=list.concat(size==='pony'?['Haflinger','Highland']:['Irish Cob','Percheron']);$('results').innerHTML=[...new Set(list)].slice(0,3).map((n,i)=>'<article class="result"><h3>'+n+'</h3><p>'+(['Piste très adaptée à tes réponses.','À rencontrer et essayer avec un encadrement.','Une autre option pertinente à comparer.'][i])+'</p></article>').join('')};</script><script src="page-locale.js?v=20260727-langfix"></script></body></html>
